<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTV - Upload Direto</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #ffffff; }
        .container { display: grid; grid-template-columns: 1fr 2fr; height: 100vh; gap: 0; }

        .control-panel { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-right: 2px solid #334155; padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .panel-scrollable { padding: 12px; flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
        .panel-footer { padding: 10px 12px; background: #0a1628; border-top: 2px solid #334155; flex-shrink: 0; }
        .panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .panel-header h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .section { margin-bottom: 10px; flex-shrink: 0; }
        .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 6px; display: block; }
        .form-group { margin-bottom: 6px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #cbd5e1; }
        input[type="text"], input[type="file"], input[type="password"], select { width: 100%; padding: 6px 10px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #ffffff; font-size: 12px; transition: all 0.2s; }
        input[type="file"] { cursor: pointer; }
        input[type="file"]::file-selector-button { background: #3b82f6; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 6px; font-size: 12px; }
        input[type="file"]::file-selector-button:hover { background: #2563eb; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        button { padding: 7px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; width: 100%; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 12px rgba(59,130,246,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #334155; color: #e2e8f0; width: 100%; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: #ef4444; color: white; padding: 4px 10px; font-size: 11px; width: auto; }
        .btn-danger:hover { background: #dc2626; }

        .progress-container { margin-bottom: 6px; display: none; }
        .progress-container.active { display: block; }
        .progress-bar { width: 100%; height: 4px; background: #334155; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); width: 0%; transition: width 0.3s ease; }
        .progress-text { font-size: 11px; color: #64748b; margin-top: 3px; }
        .file-name { font-size: 11px; color: #64748b; margin-top: 4px; padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-msg { font-size: 11px; padding: 5px 10px; border-radius: 6px; margin-bottom: 6px; display: none; flex-shrink: 0; }
        .status-msg.show { display: block; }
        .s-ok { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .s-err { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .s-warn { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }

        .queue-list { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; min-height: 0; }
        .empty-queue { text-align: center; padding: 16px; color: #475569; font-size: 12px; }
        .queue-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: rgba(255,255,255,0.04); border: 1px solid #334155; border-radius: 6px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .queue-item:hover { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.3); }
        .queue-item.active { background: rgba(59,130,246,0.12); border-color: #3b82f6; }
        .queue-item-name { font-size: 12px; font-weight: 600; color: #e2e8f0; margin-bottom: 1px; }
        .queue-item-type { font-size: 10px; color: #64748b; }

        .display-area { background: #000; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .display-hud { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); transition: opacity 0.4s ease; }
        .display-area.fs-idle .display-hud, .display-area.fs-idle .display-nav { opacity: 0; pointer-events: none; }
        .display-area.fs-idle { cursor: none; }
        .hud-info strong { font-size: 14px; font-weight: 700; display: block; }
        .hud-info span { font-size: 12px; color: #94a3b8; }
        .hud-status { font-size: 12px; color: #64748b; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 4px; }
        .display-content { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity 0.5s ease; }
        .display-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .display-content video { max-width: 100%; max-height: 100%; }
        .display-content iframe { width: 100%; height: 100%; border: none; }
        .display-placeholder { text-align: center; color: #334155; }
        .display-placeholder h2 { font-size: 64px; margin-bottom: 16px; }
        .display-placeholder p { font-size: 18px; }
        .display-nav { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 20px; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); transition: opacity 0.4s ease; }
        .nav-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; width: auto; }
        .nav-btn:hover { background: rgba(59,130,246,0.3); border-color: #3b82f6; }
        .btn-loop { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 4px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; text-align: center; line-height: 1.3; min-height: 44px; }
        .btn-loop:hover { background: #334155; color: #e2e8f0; border-color: #475569; }
        .btn-loop.active { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #60a5fa; box-shadow: 0 0 0 1px #3b82f6 inset; }
        .btn-loop-active { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.4); color: #4ade80; padding: 8px 4px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; text-align: center; line-height: 1.3; min-height: 44px; }
        .btn-loop-active.off { background: #1e293b; border-color: #334155; color: #64748b; }
        .loop-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-weight: 700; }

        .offline-banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(239,68,68,0.94); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; display: none; align-items: center; gap: 6px; }

        /* ── Placar ao Vivo do CRM na TV ── */
        .rk-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); border-radius: 6px; font-size: 12px; font-weight: 600; color: #f6d57a; cursor: pointer; }
        .rk-toggle input { width: auto; accent-color: #c9a84c; cursor: pointer; }

        .tv-rk-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .tv-rk-title { display: flex; flex-direction: column; gap: 4px; }
        .tv-rk-title h2 { font-size: clamp(22px, 2.5vw, 34px); font-weight: 800; color: #f6d57a; letter-spacing: -0.5px; }
        .tv-rk-sub { font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .tv-live-dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; display: inline-block; }
        .tv-rk-kpis { display: flex; gap: 14px; flex-wrap: wrap; }
        .tv-rk-kpi { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 18px; min-width: 170px; }
        .tv-rk-kpi small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; font-weight: 700; }
        .tv-rk-kpi strong { display: block; font-size: clamp(20px, 2.2vw, 28px); font-weight: 800; color: #fff; margin-top: 2px; }
        .tv-rk-kpi.gold strong { color: #f6d57a; }
        .tv-rk-kpi.green strong { color: #4ade80; }
        .tv-rk-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }
        .tv-rk-bar > div { height: 100%; background: linear-gradient(90deg, #c9a84c, #4ade80); border-radius: 999px; transition: width .5s ease; }
        .tv-rk-table-wrap { flex: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(15,23,42,0.7); }
        .tv-rk-table { width: 100%; border-collapse: collapse; font-size: clamp(13px, 1.25vw, 17px); }
        .tv-rk-table th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); }
        .tv-rk-table td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tv-rk-table tr.top1 td { background: rgba(201,168,76,0.1); }
        .tv-rk-table .num { text-align: center; font-variant-numeric: tabular-nums; }
        .tv-rk-table .total-cell { text-align: right; font-weight: 800; font-size: clamp(15px, 1.4vw, 20px); color: #f6d57a; }
        .tv-day-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: rgba(74,222,128,0.16); color: #4ade80; font-weight: 800; font-size: 12px; }
        .tv-rk-flash { animation: rkFlash 1.4s ease; }
        @keyframes rkFlash { 0% { background: rgba(74,222,128,0.28); } 100% { background: transparent; } }

</head>
<body>
<div class="container">

    <div class="control-panel">
        <div class="panel-scrollable">
        <div class="panel-header"><h1>📺 StreamTV</h1></div>

        <div class="status-msg" id="statusMsg"></div>

        <!-- UPLOAD -->
        <div class="section">
            <span class="section-title">Fazer Upload</span>
            <div class="form-group">
                <label>Nome/Título</label>
                <input type="text" id="mediaName" placeholder="Ex: Apresentação Q1 2024">
            </div>
            <div class="form-group">
                <label>Arquivo</label>
                <input type="file" id="mediaFile" accept="image/*,video/*,.pdf,.m3u8,.m3u" onchange="updateFileName()">

            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">Enviando... 0%</div>
            </div>
            <button class="btn-primary" id="uploadBtn" onclick="uploadMedia()">⬆️ Fazer Upload</button>
        </div>

        <!-- PLACAR CRM AO VIVO -->
        <div class="section">
            <span class="section-title">Placar CRM (Tempo Real)</span>
            <label class="rk-toggle">
                <span>🏆 Exibir Placar ao Vivo</span>
                <input type="checkbox" id="toggleRankingChk" checked onchange="toggleRankingSlide(this.checked)">
            </label>
        </div>

        <!-- STREAM / IPTV POR URL -->
        <div class="section">
            <span class="section-title">Adicionar Stream (URL / IPTV)</span>
            <div class="form-group">
                <label>Nome/Título</label>
                <input type="text" id="streamName" placeholder="Ex: Canal 24h">
            </div>
            <div class="form-group">
                <label>URL do stream</label>
                <input type="text" id="streamUrl" placeholder="https://.../lista.m3u8">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="streamType">
                    <option value="hls">📡 Stream IPTV (HLS/M3U8)</option>
                    <option value="video">🎬 Vídeo direto (MP4/WebM)</option>
                    <option value="image">🖼️ Imagem</option>
                    <option value="web">🌐 Página Web / Painel (Iframe)</option>
                </select>
            </div>
            <button class="btn-secondary" onclick="addStreamUrl()">➕ Adicionar à Fila</button>
        </div>

        <!-- FILA -->
        <div class="section" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;">
            <span class="section-title">Fila (<span id="queueCount">0</span>)</span>
            <div class="queue-list" id="queueList">
                <div class="empty-queue">Nenhuma mídia na fila</div>
            </div>
        </div>
        </div><!-- end panel-scrollable -->

        <!-- RODAPÉ FIXO: LOOP + CONTROLES -->
        <div class="panel-footer">
            <!-- CONTROLES DE LOOP -->
            <div style="margin-bottom:8px;">
                <span class="section-title" style="margin-bottom:6px;">🎬 Modo de Reprodução</span>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;">
                    <button class="btn-loop" id="btnLoopPlaylist" onclick="setLoopMode('playlist')" title="Loop pela playlist">🔁<br><span style="font-size:9px;">Playlist</span></button>
                    <button class="btn-loop" id="btnLoopSingle" onclick="setLoopMode('single')" title="Repetir vídeo único">🔂<br><span style="font-size:9px;">Único</span></button>
                    <button class="btn-loop" id="btnLoopOff" onclick="setLoopMode('off')" title="Sem loop">⏹️<br><span style="font-size:9px;">Sem Loop</span></button>
                    <button class="btn-loop-active" id="btnAutoplay" onclick="toggleAutoplay()" title="Auto avanço">▶️<br><span style="font-size:9px;" id="autoplayLabel">Auto: ON</span></button>
                </div>
            </div>
            <!-- CONTROLES GERAIS -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;">
                <button class="btn-secondary" onclick="loadFromSupabase()" style="font-size:10px;padding:6px 4px;">🔄 Sync</button>
                <button class="btn-secondary" onclick="clearLocal()" style="font-size:10px;padding:6px 4px;">🗑️ Limpar</button>
                <button class="btn-secondary" onclick="toggleFullscreen()" style="font-size:10px;padding:6px 4px;">🖥️ Full</button>
            </div>
        </div>
    </div>

    <!-- DISPLAY -->
    <div class="display-area" id="displayArea">
        <div class="offline-banner" id="offlineBanner">🔌 Sem conexão com a internet</div>
        <div class="display-hud">
            <div class="hud-info">
                <strong id="hudTitle">StreamTV</strong>
                <span id="hudPosition">Nenhuma mídia</span>
            </div>
            <div class="hud-status" id="hudStatus">Aguardando mídia...</div>
        </div>
        <div class="display-content" id="displayContent">
            <div class="display-placeholder"><h2>📺</h2><p>Nenhuma mídia para exibir</p></div>
        </div>
        <div class="display-nav">
            <button class="nav-btn" onclick="navigate(-1)">◀ Anterior</button>
            <span class="nav-counter" id="navCounter">—</span>
            <button class="nav-btn" onclick="navigate(1)">Próxima ▶</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- hls.js: dá suporte a stream IPTV (.m3u8/HLS) via MSE em qualquer navegador
     Chromium-based (Fire TV Silk, Android TV, Tizen, WebOS) — nenhum deles toca
     HLS nativamente pela tag <video> como o Safari toca. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
// =====================================================
//  STREAMTV — Supabase Storage
//  Bucket público "streamtv" — sem login, sem token, sem
//  limite baixo de tamanho (troca do GitHub Contents API,
//  que rejeitava vídeo com erro 422 "arquivo muito grande").
//  A anon key abaixo é pública por design: protegida pelas
//  policies do bucket, não por estar escondida.
// =====================================================
const SUPA_URL = 'https://prquggwhjcvenzuziaox.supabase.co';
const SUPA_KEY = 'sb_publishable_YcjSMFQoaBa5mHUtqrPCPQ_2SZmJ5aF';
const { createClient } = supabase;
const sb = createClient(SUPA_URL, SUPA_KEY);
const BUCKET = 'streamtv';

const FOLDER = 'midia'; // pasta dentro do bucket
const RANKING_FB_URL = 'https://homegr-71157-default-rtdb.firebaseio.com/equipe_danylo.json';
let queue = [];
let currentIndex = 0;
let isUploading = false;
let loopMode = 'playlist'; // 'playlist' | 'single' | 'off'
let autoplay = true;
let showRanking = localStorage.getItem('stv_show_ranking') !== '0';
let rankingData = null;
let rankingUpdatedAt = null;
let rankingPrevTotal = null;
let rankingFlashed = false;
let _lastStorageSig = null;

function rankingQueueItem() {
    return { id: 'crm_ranking_live', name: '🏆 Placar de Vendas (Ao Vivo)', type: 'ranking', source: 'crm', stPath: null };
}

function toggleRankingSlide(enabled) {
    showRanking = !!enabled;
    try { localStorage.setItem('stv_show_ranking', showRanking ? '1' : '0'); } catch (e) {}
    const without = queue.filter(it => it.type !== 'ranking');
    queue = showRanking ? [rankingQueueItem(), ...without] : without;
    if (currentIndex >= queue.length) currentIndex = 0;
    renderQueue();
    updateDisplay();
}

function setLoopMode(mode) {
    loopMode = mode;
    document.getElementById('btnLoopPlaylist').classList.toggle('active', mode === 'playlist');
    document.getElementById('btnLoopSingle').classList.toggle('active', mode === 'single');
    document.getElementById('btnLoopOff').classList.toggle('active', mode === 'off');
    // Re-render display to apply new loop setting to current video
    updateDisplay();
}

function toggleAutoplay() {
    autoplay = !autoplay;
    const btn = document.getElementById('btnAutoplay');
    document.getElementById('autoplayLabel').textContent = autoplay ? 'Auto: ON' : 'Auto: OFF';
    btn.className = autoplay ? 'btn-loop-active' : 'btn-loop-active off';
}

// ── HELPERS ──
const v   = id => document.getElementById(id).value.trim();
const set = (id, val) => { document.getElementById(id).value = val; };
const ls  = (k, v) => localStorage.setItem(k, v);
const lg  = k => localStorage.getItem(k) || '';

function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg show s-' + type;
    if (type === 'ok') setTimeout(() => el.classList.remove('show'), 4000);
}

function updateFileName() {
    const file = document.getElementById('mediaFile').files[0];
    document.getElementById('fileName').textContent = file
        ? `✓ ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`
        : 'Nenhum arquivo selecionado';
}

function updateProgress(pct) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `Enviando... ${Math.round(pct)}%`;
}

// ── DETECÇÃO DE TIPO DE MÍDIA ──
// Antes só olhava a extensão e, sem extensão nenhuma no nome do arquivo, caía
// direto em "imagem" mesmo pra vídeo/stream — usa o mimetype do arquivo como
// segunda tentativa antes de desistir e assumir imagem.
const VIDEO_EXT = ['mp4','webm','mov','avi','mkv'];
const HLS_EXT   = ['m3u8','m3u'];
function detectType(filename, mimeType) {
    const dot = filename.lastIndexOf('.');
    const ext = dot > -1 ? filename.slice(dot + 1).toLowerCase() : '';
    if (HLS_EXT.includes(ext)) return 'hls';
    if (VIDEO_EXT.includes(ext)) return 'video';
    if (ext === 'pdf') return 'document';
    if (ext) return 'image';
    if (mimeType) {
        if (mimeType.includes('mpegurl')) return 'hls';
        if (mimeType.startsWith('video/')) return 'video';
        if (mimeType === 'application/pdf') return 'document';
        if (mimeType.startsWith('image/')) return 'image';
    }
    return 'image';
}

// ── UPLOAD PARA O SUPABASE STORAGE ──
async function uploadMedia() {
    const name = v('mediaName');
    const file = document.getElementById('mediaFile').files[0];

    if (!name || !file) { alert('Preencha o nome e selecione um arquivo'); return; }
    if (isUploading) return;

    // Aviso pra arquivo grande — numa wifi de TV o upload pode travar minutos
    // sem nenhum aviso prévio de que vai demorar.
    const MAX_WARN_MB = 500;
    if (file.size / 1024 / 1024 > MAX_WARN_MB) {
        const mb = (file.size / 1024 / 1024).toFixed(0);
        if (!confirm(`Esse arquivo tem ${mb} MB — o upload pode demorar bastante numa rede de TV. Continuar mesmo assim?`)) return;
    }

    isUploading = true;
    document.getElementById('uploadBtn').disabled = true;
    document.getElementById('progressContainer').classList.add('active');
    updateProgress(10);

    try {
        const hasDot = file.name.lastIndexOf('.') > -1;
        const ext    = hasDot ? file.name.split('.').pop().toLowerCase() : 'bin';
        const safe   = name.replace(/[^a-zA-Z0-9_\-]/g, '_');
        const stPath = `${FOLDER}/${Date.now()}_${safe}.${ext}`;

        updateProgress(30);
        const { error: upErr } = await sb.storage.from(BUCKET).upload(stPath, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type || undefined
        });
        if (upErr) throw new Error(upErr.message);
        updateProgress(90);

        const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(stPath);
        const type = detectType(file.name, file.type);

        queue.push({
            id: stPath,
            name,
            type,
            url: pub.publicUrl,
            stPath,
            source: 'storage',
            fileName: file.name,
            fileSize: file.size
        });
        updateProgress(100);

        saveLocal();
        renderQueue();
        updateDisplay();
        showStatus(`✅ "${name}" salvo!`, 'ok');
        set('mediaName', '');
        document.getElementById('mediaFile').value = '';
        document.getElementById('fileName').textContent = 'Nenhum arquivo selecionado';

    } catch (err) {
        showStatus(`❌ ${err.message}`, 'err');
        alert('Erro ao enviar: ' + err.message);
    } finally {
        isUploading = false;
        document.getElementById('uploadBtn').disabled = false;
        setTimeout(() => {
            document.getElementById('progressContainer').classList.remove('active');
            updateProgress(0);
        }, 800);
    }
}

// ── ADICIONAR STREAM/IPTV POR URL (sem passar pelo Storage) ──
function addStreamUrl() {
    const name = v('streamName');
    const url  = v('streamUrl');
    const type = document.getElementById('streamType').value;
    if (!name || !url) { alert('Preencha o nome e a URL do stream'); return; }

    queue.push({
        id: 'url_' + Date.now(),
        name,
        type,
        url,
        stPath: null,     // não existe no Storage — não tenta apagar de lá
        source: 'url',
        fileName: url,
        fileSize: null
    });
    saveLocal();
    renderQueue();
    updateDisplay();
    showStatus(`✅ Stream "${name}" adicionado!`, 'ok');
    set('streamName', '');
    set('streamUrl', '');
}

// ── CARREGAR DO SUPABASE STORAGE ──
// Tenta de novo sozinho se falhar (backoff até 60s) — importante numa Fire
// Stick ligando sem ninguém por perto pra clicar "Sync" manualmente se a rede
// ainda estiver subindo no boot.
let _syncRetryDelay = 10000;
let _syncInFlight = false;
async function loadFromSupabase(isRetry, silentBackground) {
    // Evita duas sincronizações rodando ao mesmo tempo (clique duplo no "Sync",
    // ou o retry automático disparando junto com o evento 'online') — sem essa
    // trava, dois updateDisplay() concorrentes trocam o <video> no meio um do
    // outro e o play() de um deles é abortado no meio (AbortError em cascata).
    if (_syncInFlight) return;
    _syncInFlight = true;
    if (!isRetry && !silentBackground) showStatus('🔄 Carregando...', 'warn');
    try {
        const { data: files, error } = await sb.storage.from(BUCKET).list(FOLDER, {
            sortBy: { column: 'created_at', order: 'asc' }
        });
        if (error) throw new Error(error.message);

        const storageItems = (files || []).filter(f => f.name && f.id).map(f => {
            const stPath = `${FOLDER}/${f.name}`;
            const type = detectType(f.name, f.metadata?.mimetype);
            const name = f.name.replace(/^\d+_/, '').replace(/\.[^.]+$/, '').replace(/_/g, ' ');
            const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(stPath);
            return { id: stPath, name, type, url: pub.publicUrl, stPath, source: 'storage', fileName: f.name, fileSize: f.metadata?.size };
        });
        const sig = storageItems.map(i => `${i.id}:${i.fileSize || 0}`).join('|');
        // No sync em segundo plano, só reinicia o player se realmente houve mudança nos arquivos do Storage.
        if (silentBackground && sig === _lastStorageSig && queue.length) {
            clearTimeout(window._syncRetryTimer);
            _syncRetryDelay = 10000;
            return;
        }
        _lastStorageSig = sig;
        // Streams adicionados por URL não existem no Storage — o list() não os
        // vê, então precisam ser preservados manualmente ou o Sync os apaga.
        const urlItems = queue.filter(it => it.source === 'url' || (!it.stPath && it.type !== 'ranking'));
        queue = showRanking ? [rankingQueueItem(), ...storageItems, ...urlItems] : [...storageItems, ...urlItems];
        if (currentIndex >= queue.length) currentIndex = 0;

        saveLocal();
        renderQueue();
        updateDisplay();
        if (!silentBackground) showStatus(`✅ ${queue.length} item(ns) na fila`, 'ok');

        clearTimeout(window._syncRetryTimer);
        _syncRetryDelay = 10000;
    } catch (err) {
        if (!silentBackground) {
            showStatus('⚠️ Erro ao carregar — usando cache local', 'warn');
            await loadLocal();
        }
        clearTimeout(window._syncRetryTimer);
        window._syncRetryTimer = setTimeout(() => loadFromSupabase(true, silentBackground), _syncRetryDelay);
        _syncRetryDelay = Math.min(_syncRetryDelay * 2, 60000);
    } finally {
        _syncInFlight = false;
    }
}

// ── DELETAR DO SUPABASE STORAGE ──
async function deleteMedia(index) {
    const item = queue[index];
    if (!item) return;
    if (item.type === 'ranking') {
        const chk = document.getElementById('toggleRankingChk');
        if (chk) chk.checked = false;
        toggleRankingSlide(false);
        return;
    }
    if (!confirm(`Deletar "${item.name}"?`)) return;
    try {
        if (item.stPath) {
            const { error } = await sb.storage.from(BUCKET).remove([item.stPath]);
            if (error) throw new Error(error.message);
        }
        queue.splice(index, 1);
        if (currentIndex >= queue.length) currentIndex = Math.max(0, queue.length - 1);
        saveLocal(); renderQueue(); updateDisplay();
        showStatus(`🗑️ "${item.name}" removido`, 'ok');
    } catch (err) { alert('Erro ao deletar: ' + err.message); }
}

// ── PERSISTÊNCIA ROBUSTA: IndexedDB + localStorage (Fire TV safe) ──
const DB_NAME    = 'StreamTV';
const DB_VERSION = 1;
const STORE_NAME = 'persist';
let   _db        = null;

function openDB() {
    return new Promise((resolve, reject) => {
        if (_db) { resolve(_db); return; }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
            e.target.result.createObjectStore(STORE_NAME);
        };
        req.onsuccess = e => { _db = e.target.result; resolve(_db); };
        req.onerror   = () => reject(req.error);
    });
}

async function idbSet(key, value) {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx    = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req   = store.put(value, key);
            req.onsuccess = () => resolve();
            req.onerror   = () => reject(req.error);
        });
    } catch(e) { /* silently fail */ }
}

async function idbGet(key) {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx    = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req   = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror   = () => reject(req.error);
        });
    } catch(e) { return null; }
}

async function idbDelete(key) {
    try {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx    = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.delete(key);
            tx.oncomplete = () => resolve();
        });
    } catch(e) { /* silently fail */ }
}

// Salva em IndexedDB E localStorage (redundância para Fire TV)
async function saveLocal() {
    const data = JSON.stringify(queue);
    // IndexedDB — primário (persiste mesmo com WebView reiniciado)
    await idbSet('stv_queue', data);
    // localStorage — fallback
    try { localStorage.setItem('stv_queue', data); } catch(e) {}
}

// Carrega tentando IndexedDB primeiro, depois localStorage
async function loadLocal() {
    let raw = null;
    // 1) tenta IndexedDB
    try { raw = await idbGet('stv_queue'); } catch(e) {}
    // 2) fallback para localStorage
    if (!raw) {
        try { raw = localStorage.getItem('stv_queue'); } catch(e) {}
    }
    if (raw) {
        try { queue = JSON.parse(raw); renderQueue(); updateDisplay(); } catch(e) {}
    }
}

async function clearLocal() {
    if (!confirm('Limpar fila? (arquivos continuam no GitHub)')) return;
    queue = []; currentIndex = 0;
    await idbDelete('stv_queue');
    try { localStorage.removeItem('stv_queue'); } catch(e) {}
    renderQueue(); updateDisplay();
}

const _esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function _typeLabel(type) {
    if (type === 'ranking') return '🏆 Placar ao Vivo';
    if (type === 'image')   return '🖼️ Imagem';
    if (type === 'video')   return '🎬 Vídeo';
    if (type === 'hls')     return '📡 Stream IPTV';
    if (type === 'web')     return '🌐 Página Web';
    return '📄 Documento';
}

// ── RENDER ──
function renderQueue() {
    const list = document.getElementById('queueList');
    document.getElementById('queueCount').textContent = queue.length;
    document.getElementById('navCounter').textContent = queue.length ? `${currentIndex+1} / ${queue.length}` : '—';
    if (!queue.length) { list.innerHTML = '<div class="empty-queue">Nenhuma mídia na fila</div>'; return; }
    list.innerHTML = queue.map((item, i) => `
        <div class="queue-item ${i===currentIndex?'active':''}" onclick="selectMedia(${i})">
            <div class="queue-item-info">
                <div class="queue-item-name">${i+1}. ${_esc(item.name)}</div>
                <div class="queue-item-type">${_typeLabel(item.type)}${item.fileSize?' • '+(item.fileSize/1024).toFixed(0)+' KB':''}</div>
            </div>
            <button class="btn-danger" onclick="event.stopPropagation();deleteMedia(${i})">🗑️</button>
        </div>
    `).join('');
}

function selectMedia(i) { currentIndex = i; renderQueue(); updateDisplay(); }
function navigate(dir) {
    if (!queue.length) return;
    currentIndex = (currentIndex + dir + queue.length) % queue.length;
    renderQueue(); updateDisplay();
}

// Crossfade: esconde o conteúdo atual, troca por baixo, mostra de novo — em vez
// de cortar seco pra próxima mídia. Só espera a transição quando já tem algo na
// tela (primeira exibição não precisa).
function updateDisplay() {
    const c = document.getElementById('displayContent');
    const hadContent = c.childElementCount > 0;
    if (!hadContent) { _safeRenderDisplayContent(); return; }
    disposeCurrentVideo();
    c.style.opacity = '0';
    setTimeout(() => {
        _safeRenderDisplayContent();
        c.style.opacity = '1';
    }, 400);
}

// BUGFIX: _renderDisplayContent() rodava direto dentro do setTimeout acima
// sem nenhum try/catch — qualquer exceção não prevista (item malformado,
// API do navegador faltando, etc) interrompia o callback ANTES da linha
// "c.style.opacity = '1'", deixando o conteúdo com opacity:0 permanentemente
// — tela preta travada pra sempre, sem nenhum erro visível pra quem tá na
// frente da TV/tela (só no console). Isso também explica "trava tudo": em
// loopMode 'playlist' o watchdog/timers seguem tentando trocar de mídia,
// cada tentativa cai no mesmo erro, e a tela nunca volta a mostrar nada.
function _safeRenderDisplayContent() {
    try {
        _renderDisplayContent();
    } catch (e) {
        console.error('[StreamTV] erro ao renderizar mídia:', e);
        const item = queue[currentIndex];
        showPlaybackError(item ? item.name : '', 'Erro ao carregar esta mídia');
        if (loopMode === 'playlist' && navigator.onLine) setTimeout(() => navigate(1), 2500);
    }
}

// Libera o <video>/hls.js anterior explicitamente (pausa + solta o buffer)
// antes de trocar de mídia, em vez de só confiar no innerHTML/garbage collector
// — numa tela que fica rodando em loop por horas (Fire TV, pouca RAM), isso
// evita acúmulo de buffers de vídeo/stream não liberados que iam deixando a
// exibição mais pesada e propensa a travar com o tempo.
function disposeCurrentVideo() {
    clearTimeout(window._stallTimer);
    clearTimeout(window._imgTimer);
    if (window._hlsInstance) {
        try { window._hlsInstance.destroy(); } catch(e) {}
        window._hlsInstance = null;
    }
    const old = document.getElementById('mainVideo');
    if (!old) return;
    try {
        old.pause();
        old.removeAttribute('src');
        old.load();
    } catch (e) {}
}

// "Toque pra iniciar": única forma real de liberar áudio automático depois
// que o navegador bloqueia por falta de interação. Um toque AQUI conta como
// gesto do usuário — dá play() só nesse vídeo, e libera autoplay com som
// pro resto da sessão (não precisa tocar de novo nos próximos vídeos).
function showUnlockOverlay() {
    if (document.getElementById('unlockOverlay')) return; // já está mostrando
    const overlay = document.createElement('div');
    overlay.id = 'unlockOverlay';
    overlay.style.cssText = 'position:absolute;inset:0;z-index:50;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer;color:#fff;text-align:center;font-family:inherit;';
    overlay.innerHTML = '<div style="font-size:52px;">🔊</div><div style="font-size:20px;font-weight:600;">Toque para iniciar a exibição</div>';
    overlay.addEventListener('click', () => {
        overlay.remove();
        const vid = document.getElementById('mainVideo');
        if (vid) {
            armStallWatchdog(vid); // watchdog anterior foi desarmado ao mostrar essa tela
            vid.play().catch(e => console.warn('[StreamTV] ainda falhou após o toque:', e.message));
        }
    }, { once: true });
    document.getElementById('displayArea').appendChild(overlay);
}

// Mostra um aviso visível no lugar de tela preta/travada quando uma mídia não
// consegue ser reproduzida (formato não suportado no dispositivo, stream fora
// do ar, etc.) — antes disso só o modo "Playlist" pulava automaticamente; nos
// modos "Único"/"Sem Loop" a tela simplesmente ficava parada sem nenhum aviso.
function showPlaybackError(name, msg) {
    const c = document.getElementById('displayContent');
    c.innerHTML = `<div class="display-placeholder" style="color:#f87171"><h2>⚠️</h2><p>${msg}</p><p style="font-size:13px;color:#94a3b8;margin-top:6px">${name || ''}</p></div>`;
}

// Trata rejeição da Promise de vid.play() — compartilhado entre vídeo direto e
// stream HLS. NotAllowedError = bloqueio de autoplay do navegador (não é
// problema da mídia); qualquer outro erro = mostra aviso e, se fizer sentido,
// segue pra próxima mídia da fila.
function handlePlayRejection(err, item) {
    if (err.name === 'NotAllowedError') {
        // Desarma o watchdog: sem isso ele "descobre" o mesmo travamento
        // sozinho alguns segundos depois e tenta pular, disputando com o toque.
        clearTimeout(window._stallTimer);
        console.warn('[StreamTV] autoplay bloqueado pelo navegador — aguardando toque na tela');
        showUnlockOverlay();
        return;
    }
    if (err.name === 'AbortError') {
        // play() foi interrompido pela própria troca de mídia (innerHTML novo
        // ou disposeCurrentVideo rodando antes do play() anterior resolver) —
        // não é uma falha real da mídia, então não mostra erro nem pula.
        return;
    }
    console.warn('[StreamTV] reprodução falhou:', err.message);
    showPlaybackError(item.name, 'Não foi possível reproduzir esta mídia');
    if (loopMode === 'playlist' && navigator.onLine) setTimeout(() => navigate(1), 2500);
}

// Detecta vídeo travado (não avança mais, ficou "preso") e pula pro próximo
// automaticamente em vez de ficar parado pra sempre — cobre buffering que não
// se recupera, erro de decodificação, URL que parou de responder, etc.
// Reseta o cronômetro a cada 'timeupdate' real (prova de que está tocando).
// Limite de 15s (era 5s): numa wifi de Fire Stick/TV, 5s sem progresso ainda
// pode ser buffering normal — 5s estava pulando vídeo bom achando que travou.
function armStallWatchdog(vid) {
    let lastProgress = Date.now();
    const check = () => {
        if (vid !== document.getElementById('mainVideo')) return; // já trocou de mídia
        const stalled = !vid.paused && !vid.ended && (Date.now() - lastProgress > 15000);
        if (stalled) {
            if (!navigator.onLine) return; // sem internet — evita cascata de pulos, só espera reconectar
            console.warn('[StreamTV] vídeo travado, pulando para o próximo');
            if (loopMode === 'playlist') navigate(1);
            else updateDisplay(); // 'single'/'off' — tenta recarregar a mesma mídia
            return;
        }
        window._stallTimer = setTimeout(check, 2000);
    };
    vid.addEventListener('timeupdate', () => { lastProgress = Date.now(); });
    vid.addEventListener('error', () => {
        console.warn('[StreamTV] erro no vídeo, pulando para o próximo');
        const currentItem = queue[currentIndex];
        showPlaybackError(currentItem ? currentItem.name : '', 'Vídeo não suportado ou corrompido neste dispositivo');
        if (loopMode === 'playlist' && navigator.onLine) setTimeout(() => navigate(1), 2500);
    });
    window._stallTimer = setTimeout(check, 2000);
}

function _renderDisplayContent() {
    const c = document.getElementById('displayContent');
    if (!queue.length) {
        c.innerHTML = '<div class="display-placeholder"><h2>📺</h2><p>Nenhuma mídia para exibir</p></div>';
        document.getElementById('hudTitle').textContent = 'StreamTV';
        document.getElementById('hudPosition').textContent = 'Nenhuma mídia';
        document.getElementById('hudStatus').textContent = 'Aguardando mídia...';
        document.getElementById('navCounter').textContent = '—';
        return;
    }
    const item = queue[currentIndex];

    // Build loop badge
    let loopBadge = '';
    if (loopMode === 'playlist') loopBadge = '<span class="loop-badge playlist">🔁 Playlist</span>';
    else if (loopMode === 'single') loopBadge = '<span class="loop-badge single">🔂 Único</span>';

    document.getElementById('hudTitle').textContent = item.name;
    document.getElementById('hudPosition').innerHTML = `${currentIndex+1} de ${queue.length}${loopBadge}`;
    document.getElementById('hudStatus').textContent = _typeLabel(item.type);
    document.getElementById('navCounter').textContent = `${currentIndex+1} / ${queue.length}`;

    if (item.type === 'ranking') {
        c.innerHTML = _renderRankingMarkup();
        if (autoplay && loopMode === 'playlist' && queue.length > 1) {
            clearTimeout(window._imgTimer);
            window._imgTimer = setTimeout(() => navigate(1), 20000);
        }
    } else if (item.type === 'image') {
        c.innerHTML = `<img src="${item.url}" alt="${item.name}">`;
        // Auto-advance images after 10s if autoplay is on
        if (autoplay && (loopMode === 'playlist' || loopMode === 'single')) {
            clearTimeout(window._imgTimer);
            window._imgTimer = setTimeout(() => {
                if (loopMode === 'single') {
                    updateDisplay(); // re-trigger same
                } else {
                    navigate(1);
                }
            }, 10000);
        }
    } else if (item.type === 'video') {
        const loopAttr = loopMode === 'single' ? 'loop' : '';
        // Sem o atributo autoplay de propósito: se o navegador bloquear a
        // reprodução automática (política de autoplay), o atributo falha em
        // silêncio — o vídeo fica parado na primeira imagem pra sempre, sem
        // nenhum evento disparando, e só o watchdog de travamento ia
        // perceber. Chamando .play() manualmente abaixo, a Promise rejeitada
        // avisa NA HORA, e já pula pro próximo em vez de ficar preso.
        // preload="metadata" (não "auto"): em Fire TV/Smart TV com RAM curta, "auto"
        // faz o navegador tentar baixar/bufferizar o arquivo inteiro de uma vez, o
        // que estoura memória e derruba o processo em vídeos grandes (100+MB) — o
        // app "abre, não carrega e fecha". Com "metadata" ele carrega só o
        // necessário pra tocar e vai bufferizando aos poucos via range request.
        c.innerHTML = `<video id="mainVideo" preload="metadata" playsinline ${loopAttr} style="max-width:100%;max-height:100%;"><source src="${item.url}">Vídeo não suportado</video>`;
        const vid = document.getElementById('mainVideo');
        if (vid && loopMode !== 'single' && autoplay) {
            vid.addEventListener('ended', () => {
                if (loopMode === 'playlist') navigate(1);
                // loopMode 'off' = just stops
            });
        }
        if (vid) {
            armStallWatchdog(vid);
            const playPromise = vid.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(err => handlePlayRejection(err, item));
            }
        }
    } else if (item.type === 'hls') {
        // Stream IPTV (M3U8/HLS). Safari/tvOS tocam isso nativamente pela tag
        // <video>; todo o resto (Fire TV Silk, Android TV, Tizen, WebOS, Chrome)
        // não tem suporte nativo — precisa de hls.js remuxando via MSE.
        const loopAttr = loopMode === 'single' ? 'loop' : '';
        c.innerHTML = `<video id="mainVideo" preload="metadata" playsinline ${loopAttr} style="max-width:100%;max-height:100%;"></video>`;
        const vid = document.getElementById('mainVideo');
        if (!vid) return;

        const startPlayback = () => {
            if (loopMode !== 'single' && autoplay) {
                vid.addEventListener('ended', () => { if (loopMode === 'playlist') navigate(1); });
            }
            armStallWatchdog(vid);
            const playPromise = vid.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(err => handlePlayRejection(err, item));
            }
        };

        if (vid.canPlayType('application/vnd.apple.mpegurl')) {
            vid.src = item.url;
            startPlayback();
        } else if (window.Hls && Hls.isSupported()) {
            const hls = new Hls();
            window._hlsInstance = hls;
            hls.loadSource(item.url);
            hls.attachMedia(vid);
            hls.on(Hls.Events.MANIFEST_PARSED, startPlayback);
            hls.on(Hls.Events.ERROR, (evt, data) => {
                if (!data.fatal) return;
                console.warn('[StreamTV] erro fatal no stream HLS:', data.type);
                showPlaybackError(item.name, 'Stream IPTV indisponível');
                if (loopMode === 'playlist' && navigator.onLine) setTimeout(() => navigate(1), 2500);
            });
        } else {
            showPlaybackError(item.name, 'Stream IPTV (HLS) não suportado neste navegador');
        }
    } else {
        c.innerHTML = `<iframe src="${_esc(item.url)}"></iframe>`;
        if (item.type === 'web' && autoplay && loopMode === 'playlist' && queue.length > 1) {
            clearTimeout(window._imgTimer);
            window._imgTimer = setTimeout(() => navigate(1), 20000);
        }
    }
}

// ── PLACAR AO VIVO DO CRM (FIREBASE RTDB) ──
function _hojeBRT() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
}
function _horaBRT(d) {
    return (d || new Date()).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function _renderRankingMarkup() {
    if (!rankingData || !rankingData.dados) {
        return '<div class="tv-ranking"><div class="tv-rk-head"><div class="tv-rk-title"><h2>🏆 Placar ao Vivo · CRM</h2><div class="tv-rk-sub"><span class="tv-live-dot"></span>Conectando ao placar em tempo real...</div></div></div></div>';
    }
    const cfg = rankingData.config || {};
    const dados = rankingData.dados || {};
    const snapDia = rankingData.snapDia || {};
    const cotasDia = rankingData.cotasDia || {};
    const semanas = Math.max(4, Number(cfg.semanas) || 5);
    const meta = Number(cfg.meta) || 0;
    const metaDia = Number(cfg.vendas_dia) || 0;
    const hoje = _hojeBRT();

    const rows = Object.entries(dados).map(([key, val]) => {
        const s = Array.isArray(val.s) ? val.s : [];
        const total = s.reduce((a, b) => a + (Number(b) || 0), 0);
        const snap = snapDia[key];
        const diaSnap = snap && snap.data === hoje ? Math.max(0, total - (Number(snap.base) || 0)) : 0;
        const cDia = cotasDia[key];
        const diaExtra = cDia && cDia.data === hoje ? (Number(cDia.extra) || 0) : 0;
        const vendasHoje = diaSnap + diaExtra;
        const taxa = val.conversao && val.conversao.taxa != null ? `${val.conversao.taxa}%` : '—';
        return { key, nome: val.nome || key, s, total, vendasHoje, taxa };
    }).sort((a, b) => b.total - a.total || b.vendasHoje - a.vendasHoje || a.nome.localeCompare(b.nome, 'pt-BR'));

    const totalMes = rows.reduce((a, r) => a + r.total, 0);
    const totalHoje = rows.reduce((a, r) => a + r.vendasHoje, 0);
    const pctMeta = meta > 0 ? Math.min(100, Math.round((totalMes / meta) * 100)) : 0;
    const medals = ['🥇', '🥈', '🥉'];
    const flashCls = rankingFlashed ? ' tv-rk-flash' : '';
    rankingFlashed = false;

    const weekHeaders = Array.from({ length: semanas }, (_, i) => `<th class="num">S${i + 1}</th>`).join('');
    const bodyRows = rows.map((r, idx) => {
        const pos = idx < 3 ? medals[idx] : `${idx + 1}º`;
        const weekCells = Array.from({ length: semanas }, (_, i) => `<td class="num">${Number(r.s[i]) || 0}</td>`).join('');
        const hojeBadge = r.vendasHoje > 0 ? `<span class="tv-day-pill">+${r.vendasHoje}</span>` : '<span style="color:#475569">0</span>';
        return `<tr class="${idx === 0 && r.total > 0 ? 'top1' : ''}${flashCls}">
            <td><strong>${pos}</strong></td>
            <td><strong>${_esc(r.nome)}</strong></td>
            <td class="num">${hojeBadge}</td>
            ${weekCells}
            <td class="num" style="color:#94a3b8">${_esc(r.taxa)}</td>
            <td class="total-cell">${r.total}</td>
        </tr>`;
    }).join('');

    return `<div class="tv-ranking">
        <div class="tv-rk-head">
            <div class="tv-rk-title">
                <h2>🏆 ${_esc(cfg.equipe || 'Placar de Vendas')}</h2>
                <div class="tv-rk-sub">
                    <span class="tv-live-dot"></span>
                    <span>Sincronização automática em tempo real · atualizado às ${_horaBRT(rankingUpdatedAt)}</span>
                </div>
            </div>
            <div class="tv-rk-kpis">
                <div class="tv-rk-kpi gold">
                    <small>Cotas no mês${meta ? ` (Meta ${meta})` : ''}</small>
                    <strong>${totalMes}${meta ? ` / ${meta} (${pctMeta}%)` : ''}</strong>
                    ${meta ? `<div class="tv-rk-bar"><div style="width:${pctMeta}%"></div></div>` : ''}
                </div>
                <div class="tv-rk-kpi green">
                    <small>Vendas hoje${metaDia ? ` (Meta ${metaDia})` : ''}</small>
                    <strong>${totalHoje}${metaDia ? ` / ${metaDia}` : ''}</strong>
                </div>
            </div>
        </div>
        <div class="tv-rk-table-wrap">
            <table class="tv-rk-table">
                <thead><tr><th>#</th><th>Vendedor</th><th class="num">Hoje</th>${weekHeaders}<th class="num">Conv.</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>${bodyRows}</tbody>
            </table>
        </div>
    </div>`;
}

function _applyRankingPayload(data) {
    if (!data || typeof data !== 'object') return;
    const total = Object.values(data.dados || {}).reduce((sum, v) => sum + (Array.isArray(v.s) ? v.s.reduce((a, b) => a + (Number(b) || 0), 0) : 0), 0);
    if (rankingPrevTotal !== null && total !== rankingPrevTotal) rankingFlashed = true;
    rankingPrevTotal = total;
    rankingData = data;
    rankingUpdatedAt = new Date();
    const cur = queue[currentIndex];
    if (cur && cur.type === 'ranking') {
        const c = document.getElementById('displayContent');
        if (c) c.innerHTML = _renderRankingMarkup();
    }
}

async function _fetchRanking() {
    try {
        const res = await fetch(RANKING_FB_URL, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        _applyRankingPayload(data);
    } catch (e) {
        console.warn('[StreamTV] erro ao atualizar placar CRM:', e.message);
    }
}

function _startRankingSync() {
    _fetchRanking();
    // Tempo real via Firebase RTDB REST SSE + fallback por polling a cada 15s
    if (typeof EventSource !== 'undefined') {
        try {
            const es = new EventSource(RANKING_FB_URL);
            const onEvent = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg && msg.path === '/' && msg.data) _applyRankingPayload(msg.data);
                    else _fetchRanking();
                } catch (e) { _fetchRanking(); }
            };
            es.addEventListener('put', onEvent);
            es.addEventListener('patch', onEvent);
            es.onerror = () => { /* fallback polling abaixo garante continuidade */ };
        } catch (e) {}
    }
    setInterval(_fetchRanking, 15000);
}

// ── TECLADO + FULLSCREEN ──
// BUGFIX: esse listener não checava se o foco estava num campo de texto nem
// se havia Ctrl/Cmd/Alt pressionado — digitar "f" ou espaço em "Nome/Título"
// (ex: "Filme", "Perfil") disparava tela cheia no meio da digitação, e
// Ctrl+F (busca do navegador) também era sequestrado. Agora ignora
// atalhos com modificador e qualquer tecla digitada dentro de input/textarea.
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const alvo = e.target;
    if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.isContentEditable)) return;
    if (['ArrowRight',' '].includes(e.key)) { e.preventDefault(); navigate(1); }
    else if (e.key === 'ArrowLeft')         { e.preventDefault(); navigate(-1); }
    else if (e.key==='f'||e.key==='F')      { e.preventDefault(); toggleFullscreen(); }
});

// Fullscreen com fallback prefixado: vários navegadores de Smart TV (Tizen
// mais antigo, WebOS, algumas versões do Silk do Fire Stick) só têm a API
// prefixada (webkit/moz/ms) ou nenhuma — chamar a versão padrão direto lançava
// erro antes até do .catch() conseguir pegar, travando o botão "Full"/tecla F.
function _fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || null;
}
function _requestFS(el) {
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!fn) return Promise.reject(new Error('Tela cheia não suportada neste navegador'));
    const r = fn.call(el);
    return r && r.catch ? r : Promise.resolve();
}
function _exitFS() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (!fn) return Promise.reject(new Error('Tela cheia não suportada neste navegador'));
    const r = fn.call(document);
    return r && r.catch ? r : Promise.resolve();
}
function toggleFullscreen() {
    const el = document.getElementById('displayArea');
    const action = !_fsElement() ? _requestFS(el) : _exitFS();
    action.catch(e => showStatus('⚠️ ' + e.message, 'warn'));
}

// ── AUTO-ESCONDER HUD/NAV EM FULLSCREEN ──
// Some (opacity 0) depois de 3s parado, só quando em fullscreen; qualquer
// movimento do mouse mostra de novo e reinicia a contagem. Fora do fullscreen
// os controles ficam sempre visíveis (não faz sentido escondê-los ali).
let _fsIdleTimer = null;
function _fsShowControls() {
    const area = document.getElementById('displayArea');
    area.classList.remove('fs-idle');
    clearTimeout(_fsIdleTimer);
    if (_fsElement() === area) {
        _fsIdleTimer = setTimeout(() => area.classList.add('fs-idle'), 3000);
    }
}
function _onFsChange() {
    const area = document.getElementById('displayArea');
    if (_fsElement() === area) _fsShowControls();
    else { area.classList.remove('fs-idle'); clearTimeout(_fsIdleTimer); }
}
document.addEventListener('fullscreenchange', _onFsChange);
document.addEventListener('webkitfullscreenchange', _onFsChange);
document.addEventListener('mozfullscreenchange', _onFsChange);
document.addEventListener('MSFullscreenChange', _onFsChange);
document.getElementById('displayArea').addEventListener('mousemove', _fsShowControls);

// ── STATUS DE REDE ──
// Mostra um aviso visível quando a internet cai (comum em Fire Stick/TV box)
// em vez de deixar a tela só piscando/preta sem explicação. Ao reconectar,
// ressincroniza com o Supabase automaticamente.
function _updateOnlineBanner() {
    const b = document.getElementById('offlineBanner');
    if (!b) return;
    b.style.display = navigator.onLine ? 'none' : 'flex';
}
window.addEventListener('online', () => {
    _updateOnlineBanner();
    showStatus('✅ Conexão restabelecida', 'ok');
    loadFromSupabase();
});
window.addEventListener('offline', () => {
    _updateOnlineBanner();
    showStatus('⚠️ Sem conexão com a internet', 'warn');
});

// ── INIT ──
const _rkChk = document.getElementById('toggleRankingChk');
if (_rkChk) _rkChk.checked = showRanking;
setLoopMode('playlist'); // default: loop playlist
_updateOnlineBanner();
_startRankingSync();
loadFromSupabase();
// Ressincroniza mídias do Storage em segundo plano a cada 60s (só recarrega se houver mudança)
setInterval(() => loadFromSupabase(true, true), 60000);
</script>
